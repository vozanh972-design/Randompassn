<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đang chuyển hướng...</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Ambient blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      pointer-events: none;
    }
    .blob-1 { width: 420px; height: 420px; background: #6c8fff; top: -100px; left: -100px; }
    .blob-2 { width: 320px; height: 320px; background: #a78bfa; bottom: -80px; right: -60px; }
    .blob-3 { width: 200px; height: 200px; background: #38bdf8; bottom: 80px; left: 80px; }

    /* Floating shapes */
    .shape {
      position: fixed;
      pointer-events: none;
      animation: float 6s ease-in-out infinite;
    }
    .shape-dot { width: 12px; height: 12px; border-radius: 50%; }
    .s1 { top: 18%; left: 12%; background: #f472b6; opacity: 0.5; animation-delay: 0s; }
    .s2 { top: 30%; right: 10%; background: #c4b5fd; opacity: 0.5; animation-delay: 1.5s; }
    .s3 { bottom: 22%; right: 18%; background: #67e8f9; opacity: 0.5; animation-delay: 3s; }
    .s4 { bottom: 35%; left: 8%; width: 18px; height: 18px; background: #fbbf24; opacity: 0.3; animation-delay: 2s; }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-14px); }
    }

    /* Paper plane */
    .plane-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 8px;
      animation: planeFly 3s ease-in-out infinite;
    }
    @keyframes planeFly {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50%       { transform: translateY(-10px) rotate(5deg); }
    }
    .plane-icon {
      width: 68px; height: 68px;
      background: #e8efff;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(99,130,255,0.15);
    }
    .plane-icon svg { width: 34px; height: 34px; }

    /* Card */
    .card {
      background: #fff;
      border-radius: 28px;
      padding: 48px 52px 40px;
      max-width: 560px;
      width: 92vw;
      box-shadow: 0 8px 40px rgba(80,110,200,0.10), 0 1px 3px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 800;
      color: #1a1f3c;
      margin: 18px 0 10px;
      letter-spacing: -0.02em;
      text-align: center;
    }

    .subtitle {
      color: #64748b;
      font-size: 0.96rem;
      line-height: 1.65;
      text-align: center;
      max-width: 360px;
      margin-bottom: 36px;
    }

    /* Browser mockup */
    .browser {
      width: 100%;
      background: #f5f7ff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(80,110,200,0.12);
      margin-bottom: 32px;
    }
    .browser-bar {
      background: #4f6af5;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .dot-r { background: #f87171; }
    .dot-y { background: #fbbf24; }
    .dot-g { background: #4ade80; }
    .browser-bar-track {
      flex: 1;
      height: 7px;
      background: rgba(255,255,255,0.18);
      border-radius: 9px;
      margin-left: 8px;
      position: relative;
      overflow: hidden;
    }
    .browser-bar-fill {
      height: 100%;
      background: rgba(255,255,255,0.55);
      border-radius: 9px;
      width: 100%;
      transform-origin: left;
      transition: transform 1s linear;
    }

    .browser-body {
      padding: 32px 24px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* Countdown ring */
    .ring-wrap {
      position: relative;
      width: 110px; height: 110px;
      display: flex; align-items: center; justify-content: center;
    }
    .ring-svg {
      position: absolute;
      top: 0; left: 0;
      width: 110px; height: 110px;
      transform: rotate(-90deg);
    }
    .ring-track {
      fill: none;
      stroke: #e8efff;
      stroke-width: 7;
    }
    .ring-progress {
      fill: none;
      stroke: #4f6af5;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-dasharray: 283;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }
    .ring-num {
      font-size: 2.2rem;
      font-weight: 800;
      color: #4f6af5;
      position: relative;
      z-index: 2;
      line-height: 1;
    }

    .redirect-label {
      color: #4f6af5;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.01em;
    }

    /* Buttons */
    .btn-primary {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #4f6af5;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 16px 36px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(79,106,245,0.35);
      margin-bottom: 18px;
    }
    .btn-primary:hover {
      background: #3a53d8;
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(79,106,245,0.45);
    }
    .btn-primary svg { width: 20px; height: 20px; }

    .help-link {
      font-size: 0.88rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }
    .help-link span { color: #4f6af5; font-weight: 600; text-decoration: underline; cursor: pointer; }
    .help-link svg { width: 16px; height: 16px; color: #94a3b8; }

    @media (max-width: 480px) {
      .card { padding: 36px 22px 30px; }
      h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="shape shape-dot s1"></div>
  <div class="shape shape-dot s2"></div>
  <div class="shape shape-dot s3"></div>
  <div class="shape shape-dot s4"></div>

  <div class="card">
    <!-- Paper plane -->
    <div class="plane-wrap">
      <div class="plane-icon">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 8L42 24L6 40V28L32 24L6 20V8Z" fill="#4f6af5"/>
        </svg>
      </div>
    </div>

    <h1>Đang chuyển hướng...</h1>
    <p class="subtitle">
      Bạn sẽ được chuyển hướng đến trang mới trong giây lát.<br>
      Nếu không được chuyển hướng, vui lòng nhấp vào nút bên dưới.
    </p>

    <!-- Browser mockup -->
    <div class="browser">
      <div class="browser-bar">
        <div class="dot dot-r"></div>
        <div class="dot dot-y"></div>
        <div class="dot dot-g"></div>
        <div class="browser-bar-track">
          <div class="browser-bar-fill" id="barFill"></div>
        </div>
      </div>
      <div class="browser-body">
        <div class="ring-wrap">
          <svg class="ring-svg" viewBox="0 0 110 110">
            <circle class="ring-track" cx="55" cy="55" r="45"/>
            <circle class="ring-progress" id="ringProgress" cx="55" cy="55" r="45"/>
          </svg>
          <span class="ring-num" id="countNum">10</span>
        </div>
        <div class="redirect-label">Đang chuyển hướng...</div>
      </div>
    </div>

    <!-- CTA -->
    <a href="https://tainguyenall.com" class="btn-primary" id="redirectBtn">
      Chuyển hướng ngay
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M13 6l6 6-6 6"/>
      </svg>
    </a>

    <a href="https://tainguyenall.com" class="help-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/>
      </svg>
      Gặp sự cố? <span onclick="window.location.href='https://tainguyenall.com'">Quay lại trang chủ</span>
    </a>
  </div>

  <script>
    const TOTAL = 10;
    const CIRCUMFERENCE = 2 * Math.PI * 45; // ≈ 282.74
    const ringEl = document.getElementById('ringProgress');
    const numEl  = document.getElementById('countNum');
    const barEl  = document.getElementById('barFill');
    const TARGET = 'https://tainguyenall.com';

    ringEl.style.strokeDasharray = CIRCUMFERENCE;
    ringEl.style.strokeDashoffset = 0;

    let remaining = TOTAL;

    function update() {
      numEl.textContent = remaining;
      // ring shrinks as time passes
      const offset = CIRCUMFERENCE * (1 - remaining / TOTAL);
      ringEl.style.strokeDashoffset = offset;
      // address bar fill shrinks
      barEl.style.transform = `scaleX(${remaining / TOTAL})`;
    }

    update(); // initial paint

    const timer = setInterval(() => {
      remaining--;
      update();
      if (remaining <= 0) {
        clearInterval(timer);
        window.location.href = TARGET;
      }
    }, 1000);

    document.getElementById('redirectBtn').addEventListener('click', (e) => {
      clearInterval(timer);
    });
  </script>
</body>
</html>
